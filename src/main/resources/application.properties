spring.application.name=benefits
server.port=${SERVER_PORT:8081}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] %logger{36} - %msg%n

# Local defaults are for development only. Set these environment variables in other environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/benefits}
spring.datasource.username=${DB_USERNAME:benefits_dev}
spring.datasource.password=${DB_PASSWORD:benefits_dev_only}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema, including Identity and Spring Session tables.
spring.flyway.enabled=true

# Persist server-side sessions in PostgreSQL without automatic inactivity expiry.
spring.session.timeout=-1s
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.max-age=2147483647s
server.servlet.session.cookie.same-site=lax

# Gmail SMTP. MAIL_APP_PASSWORD is a Google App Password and must stay outside the repository.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:wegbenefits@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:}
app.mail.from=${MAIL_FROM:wegbenefits@gmail.com}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# Expose only the health endpoint. Never return database details in health responses.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
# SMTP is needed for account creation, but its credentials should not determine API/database health.
management.health.mail.enabled=false

# CORS defaults are for local desktop/mobile development. Configure explicitly per environment.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Avoid leaking exception internals through Spring Boot's fallback error endpoint.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
