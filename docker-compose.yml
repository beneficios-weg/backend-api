services:
  postgres:
    image: postgres:17-alpine
    container_name: weg-benefits-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: benefits
      POSTGRES_USER: benefits_dev
      # Development-only password. Replace it outside local development.
      POSTGRES_PASSWORD: benefits_dev_only
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - benefits-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  benefits-postgres-data:
